<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Empresarial - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black h-screen flex items-center justify-center font-sans">

    <div class="bg-gray-900 p-8 rounded-lg shadow-lg w-full max-w-md border border-gray-700">
        
        <h2 class="text-3xl font-bold text-white text-center mb-6">Gestão ERP</h2>
        
        {% if erro %}
        <div class="bg-red-600 bg-opacity-20 border border-red-500 text-red-400 px-4 py-3 rounded mb-6 text-center font-bold">
            {{ erro }}
        </div>
        {% endif %}
        
        <form action="/api/login" method="POST" class="space-y-6">
            
            <div>
                <label class="block text-gray-400 text-sm font-bold mb-2" for="username">Usuário</label>
                <input class="w-full px-4 py-3 rounded bg-gray-800 text-white border border-gray-600 focus:outline-none focus:border-blue-500" 
                       id="username" name="username" type="text" placeholder="Digite seu usuário" required>
            </div> 
            
            <div>
                <label class="block text-gray-400 text-sm font-bold mb-2" for="password">Senha</label>
                <input class="w-full px-4 py-3 rounded bg-gray-800 text-white border border-gray-600 focus:outline-none focus:border-blue-500" 
                       id="password" name="password" type="password" placeholder="••••••••" required>
            </div>

            <div class="flex justify-end">
                <a href="#" class="text-sm text-blue-400 hover:text-blue-300">Esqueci minha senha</a>
            </div>
            
            <div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded focus:outline-none focus:shadow-outline transition duration-200 hx-boost="true">
                    ENTRAR
                </button>
            </div>
        </form>
    </div>

</body>
</html>
